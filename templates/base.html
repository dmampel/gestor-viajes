<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Gran Gestor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13l5 5v5H3z"/><circle cx="8" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg></span>Gran Gestor</div>
            {% if session.get('role') %}
            <a href="{{ url_for('logout') }}" class="btn-salir">Salir</a>
            {% endif %}
        </header>

        <main class="app-content">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash-messages">
                {% for message in messages %}
                <div class="flash-toast">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </main>

        <nav class="bottom-nav">
            <div class="nav-brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13l5 5v5H3z"/><circle cx="8" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg></span>Gran Gestor</div>
            <a href="{{ url_for('pagos') }}" class="nav-item {% if request.endpoint == 'pagos' %}active{% endif %}">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2"/></svg></span>
                <span class="nav-label">Pagos</span>
            </a>
            <a href="{{ url_for('clientes') }}"
                class="nav-item {% if request.endpoint == 'clientes' %}active{% endif %}">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2.5.6 4 2.6 4 5.5"/></svg></span>
                <span class="nav-label">Clientes</span>
            </a>
            <a href="{{ url_for('viajes') }}" class="nav-item {% if request.endpoint == 'viajes' %}active{% endif %}">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h8"/></svg></span>
                <span class="nav-label">Viajes</span>
            </a>
            <a href="{{ url_for('historial') }}"
                class="nav-item {% if request.endpoint == 'historial' %}active{% endif %}">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
                <span class="nav-label">Historial</span>
            </a>
        </nav>
    </div>
</body>

</html>
